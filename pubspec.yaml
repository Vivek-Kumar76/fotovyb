name: p1
description: "FotoVyb - Creative Professional Marketplace."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  lucide_icons_flutter: ^4.0.2

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^3.0.0

  # Networking & Storage
  dio: ^5.11.1
  shared_preferences: ^2.5.2

  # Media & Hardware
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Uncomment when you have local images/icons:
  # assets:
  #   - assets/images/
  #   - assets/icons/